<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏋️ Workout Log</h1>
    
    <div class="card">
      <h2>เพิ่มรายการออกกำลังกาย</h2>
      <form id="workout-form">
        <input type="text" id="title" placeholder="ชื่อกิจกรรม (เช่น ตีแบดมินตัน)" required>
        <select id="category" required>
          <option value="">-- เลือกประเภท --</option>
          <option value="badminton">badminton</option>
          <option value="running">running</option>
          <option value="gym">gym</option>
          <option value="other">other</option>
        </select>
        <input type="number" id="duration" placeholder="ระยะเวลา (นาที)" required min="1">
        <input type="date" id="date" required>
        <button type="submit" class="btn-primary">บันทึกรายการ</button>
      </form>
    </div>

    <div class="filter-section">
      <label for="filter-category">กรองตามประเภท: </label>
      <select id="filter-category">
        <option value="all">ทั้งหมด</option>
        <option value="badminton">badminton</option>
        <option value="running">running</option>
        <option value="gym">gym</option>
        <option value="other">other</option>
      </select>
    </div>

    <div class="card">
      <h2>รายการทั้งหมด</h2>
      <div id="workout-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
