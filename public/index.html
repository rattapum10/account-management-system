<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏋️ Workout Log</h1>

    <div class="card">
      <h2>เพิ่มรายการออกกำลังกาย</h2>
      <form id="workout-form">
        <div class="form-group">
          <input type="text" id="title" placeholder="ชื่อกิจกรรม (เช่น ตีแบดมินตัน)" required />
        </div>
        <div class="form-group">
          <select id="type" required>
            <option value="">-- เลือกประเภท --</option>
            <option value="คาร์ดิโอ">คาร์ดิโอ</option>
            <option value="เวทเทรนนิ่ง">เวทเทรนนิ่ง</option>
            <option value="ยืดเหยียด">ยืดเหยียด</option>
            <option value="กีฬา">กีฬา</option>
          </select>
        </div>
        <div class="form-group">
          <input type="number" id="duration" placeholder="ระยะเวลา (นาที)" required />
        </div>
        <div class="form-group">
          <input type="date" id="date" required />
        </div>
        <button type="submit" class="btn-submit">บันทึกรายการ</button>
      </form>
    </div>

    <div class="filter-section">
      <label for="filter-type">กรองตามประเภท:</label>
      <select id="filter-type">
        <option value="ทั้งหมด">ทั้งหมด</option>
        <option value="คาร์ดิโอ">คาร์ดิโอ</option>
        <option value="เวทเทรนนิ่ง">เวทเทรนนิ่ง</option>
        <option value="ยืดเหยียด">ยืดเหยียด</option>
        <option value="กีฬา">กีฬา</option>
      </select>
    </div>

    <div class="card">
      <h2>รายการทั้งหมด</h2>
      <div id="workout-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
